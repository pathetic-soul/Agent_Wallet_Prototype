[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]

remappings = [
  "@account-abstraction/=node_modules/@account-abstraction/",
  "@openzeppelin/=node_modules/@openzeppelin/"
]

